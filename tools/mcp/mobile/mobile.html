<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161b18">
  <title>Willow Mobile</title>
  <link rel="stylesheet" href="/mobile.css">
  <script src="/mobile.js" defer></script>
</head>
<body data-page="picker">
  <main>
    <section class="picker" aria-labelledby="picker-title">
      <header>
        <h1 id="picker-title">Willow <span>Mobile</span></h1>
      </header>
      <p id="picker-status" role="status">Connecting to Willow…</p>
      <button id="continue" class="continue" type="button" hidden>
        <span class="continue-label">Playing on PC</span>
        <span id="continue-title" class="continue-title"></span>
        <span class="continue-action">Continue</span>
      </button>
      <input id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off" hidden>
      <ul id="library" class="library" aria-label="Games"></ul>
      <button id="refresh" type="button" hidden>Check again</button>
    </section>

    <section class="display" aria-label="Game">
      <header>
        <div>
          <h1>Willow <span>Mobile</span></h1>
          <p id="game-title" hidden></p>
        </div>
        <div class="header-actions">
          <button id="settings" type="button">Settings</button>
          <button id="back" type="button">Games</button>
        </div>
      </header>
      <div class="screen" id="screen">
        <canvas id="frame" role="img" aria-label="Live game screen" width="240" height="160" hidden></canvas>
        <div class="waiting" id="waiting">
          <p id="hint">Starting…</p>
        </div>
      </div>
      <div class="player-controls">
        <p id="status" role="status"></p>
        <button id="autoplay" type="button" disabled>Auto Play</button>
      </div>
    </section>
    <section class="gamepad" aria-label="Gamepad" inert>
      <button type="button" class="left-shoulder" data-key="512">L</button>
      <button type="button" class="select-key" data-key="4">Select</button>
      <button type="button" class="start-key" data-key="8">Start</button>
      <button type="button" class="right-shoulder" data-key="256">R</button>
      <div class="primary">
        <div class="directions" role="group" aria-label="Direction pad">
          <button type="button" data-key="64" aria-label="Up">▲</button>
          <button type="button" data-key="32" aria-label="Left">◀</button>
          <div class="dpad-center"></div>
          <button type="button" data-key="16" aria-label="Right">▶</button>
          <button type="button" data-key="128" aria-label="Down">▼</button>
        </div>
        <div class="actions" role="group" aria-label="Action buttons">
          <button type="button" data-key="2">B</button>
          <button type="button" data-key="1">A</button>
        </div>
      </div>
    </section>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <label for="speed">Game speed</label>
    <select id="speed" disabled>
      <option value="0">PC speed</option>
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
      <option value="-1">Maximum</option>
    </select>
    <label for="video-mode">Video stream</label>
    <select id="video-mode">
      <option value="auto">Auto (prefer NVIDIA HEVC)</option>
      <option value="h264">H.264</option>
      <option value="png">PNG</option>
    </select>
    <p id="stream-status" role="status"></p>
    <p id="settings-status"></p>
    <form method="dialog" class="dialog-actions">
      <button type="submit">Done</button>
    </form>
  </dialog>
  <dialog id="autoplay-dialog" aria-labelledby="autoplay-title">
    <h2 id="autoplay-title">Auto Play</h2>
    <form id="autoplay-form" method="dialog">
      <label for="autoplay-model">Model</label>
      <select id="autoplay-model" required></select>
      <div class="dialog-actions">
        <button id="autoplay-cancel" type="button">Cancel</button>
        <button type="submit">Start Auto Play</button>
      </div>
    </form>
  </dialog>
</body>
</html>
